name: APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleRelease --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk KufurAlarm.apk
      - name: APK'yı apk dalına koy
        run: |
          mkdir out && cp KufurAlarm.apk out/ && cd out
          git init -q -b apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add KufurAlarm.apk
          git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
      - name: Sürüm yayınla
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest KufurAlarm.apk -t "Küfür Alarmı" -n "Telefona indir ve kur."
