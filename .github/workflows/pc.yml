name: PC
on:
  push:
    paths: ["pc/**", ".github/workflows/pc.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Paketler
        run: python -m pip install SpeechRecognition PyAudio pyinstaller
      - name: Test
        shell: pwsh
        run: |
          python pc/kufur_alarm.py --test "siktir git" "çok sıkıldım" "amına" "eve götür"
          python -c "import speech_recognition as sr, pyaudio, tkinter; print('ok', sr.__version__)"
      - name: EXE derle
        run: pyinstaller --onefile --noconsole --name KufurAlarmi --collect-data speech_recognition pc/kufur_alarm.py
      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist/KufurAlarmi.exe out/
          Copy-Item pc/ekstra_kelimeler.txt out/
          Compress-Archive -Path out/* -DestinationPath KufurAlarm-PC.zip
      - name: pc dalına koy
        shell: bash
        run: |
          mkdir pub && cp KufurAlarm-PC.zip pub/ && cd pub
          git init -q -b pc
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add KufurAlarm-PC.zip
          git commit -q -m "PC ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pc
